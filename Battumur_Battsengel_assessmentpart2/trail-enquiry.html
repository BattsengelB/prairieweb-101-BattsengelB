<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Trail Enquiry • Explore Alberta Trails</title>

    <meta name="description" content="Send a question about beginner-friendly trails.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSP: prevents malicious scripts -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self';">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="main">

    <h1>Trail Enquiry Form</h1>

    <!-- ARIA live region for errors -->
    <div id="errors" aria-live="polite"></div>

    <form id="trailForm" novalidate>

        <label for="name">Name (required)</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email (required)</label>
        <input id="email" name="email" type="email" required>

        <label for="length">Trail Length</label>
        <select id="length" name="length">
            <option value="short">Short (1–3 km)</option>
            <option value="medium">Medium (4–7 km)</option>
            <option value="long">Long (8+ km)</option>
        </select>

        <label for="message">Message (max 500 characters)</label>
        <textarea id="message" name="message" rows="4" maxlength="500" required></textarea>

        <button type="submit">Send Enquiry</button>
    </form>

</main>

<script type="module" src="js/script.js"></script>

</body>
</html>
